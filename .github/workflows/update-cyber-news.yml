name: Atualizar radar de ciberseguranca

on:
  schedule:
    # Executa duas vezes por dia em UTC; agendamentos podem atrasar no GitHub.
    - cron: '17 10,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Atualizar cards RSS e README
        run: python scripts/update_news.py --fetch
      - name: Publicar somente se houve noticias novas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md news.json assets/news-1.gif assets/news-2.gif assets/news-3.gif
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nas noticias"
          else
            git commit -m "docs: atualiza noticias de ciberseguranca [skip ci]"
            git push
          fi
